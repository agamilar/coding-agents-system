version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coding-agents-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Mount private key (create this file before running)
      - ./keys:/app/keys:ro
      # Mount logs
      - ./logs:/app/logs
      # For development: mount code (comment out for production)
      # - .:/app
    environment:
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_PRIVATE_KEY_PATH=${GITHUB_APP_PRIVATE_KEY_PATH}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - GITHUB_INSTALLATION_ID=${GITHUB_INSTALLATION_ID}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - YANDEX_API_KEY=${YANDEX_API_KEY:-}
      - YANDEX_FOLDER_ID=${YANDEX_FOLDER_ID:-}
      - YANDEX_MODEL=${YANDEX_MODEL:-yandexgpt-lite}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-5-20250929}
      - USE_NGROK=${USE_NGROK:-false}
      - NGROK_AUTH_TOKEN=${NGROK_AUTH_TOKEN:-}
      - NGROK_SUBDOMAIN=${NGROK_SUBDOMAIN:-}
      - MAX_ITERATIONS=${MAX_ITERATIONS:-5}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - FLASK_PORT=${FLASK_PORT:-3000}
      - FLASK_HOST=${FLASK_HOST:-0.0.0.0}
      - CODE_AGENT_TEMPERATURE=${CODE_AGENT_TEMPERATURE:-0.3}
      - REVIEW_AGENT_TEMPERATURE=${REVIEW_AGENT_TEMPERATURE:-0.2}
      - MIN_TEST_COVERAGE=${MIN_TEST_COVERAGE:-80}
    env_file:
      - .env
    networks:
      - coding-agents-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: ngrok for local development tunnel
  ngrok:
    image: ngrok/ngrok:latest
    container_name: coding-agents-ngrok
    restart: unless-stopped
    command:
      - "http"
      - "app:3000"
      - "--authtoken=${NGROK_AUTH_TOKEN}"
      - "--log=stdout"
    ports:
      - "4040:4040"  # ngrok web interface
    depends_on:
      - app
    networks:
      - coding-agents-network
    profiles:
      - ngrok  # Only start with: docker-compose --profile ngrok up

networks:
  coding-agents-network:
    driver: bridge

volumes:
  logs:
